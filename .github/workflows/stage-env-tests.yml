name: Stage-Env Tests

on:
  push:
    branches: [ main, develop, feature/** ]
    paths:
      - 'tests/stage-env/**'
      - '.github/workflows/stage-env-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tests/stage-env/**'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: tests/stage-env
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests
        working-directory: tests/stage-env
        run: |
          pytest tests/unit/ -v --junit-xml=junit/unit-results.xml
      
      - name: Run integration tests
        working-directory: tests/stage-env
        run: |
          pytest tests/integration/ -v --junit-xml=junit/integration-results.xml
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: tests/stage-env/junit/*.xml
      
      - name: Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: "tests/stage-env/junit/*.xml"


  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: test
    
    services:
      docker:
        image: docker:dind
        options: --privileged
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      
      - name: Install dependencies
        working-directory: tests/stage-env
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run E2E tests
        working-directory: tests/stage-env
        run: |
          pytest tests/e2e/ -v --junit-xml=junit/e2e-results.xml
        timeout-minutes: 30
      
      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: tests/stage-env/junit/e2e-results.xml
