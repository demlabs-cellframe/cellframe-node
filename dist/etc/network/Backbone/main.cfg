[chain]
id=0x0000000000000002
shard_id=0x0000000000000000
name=main
load_priority=2
# Possible values [token, emission, transaction, ca, sign, decree, anchor, custom] 
datum_types=[transaction,anchor]
default_datum_types=[transaction,anchor]
mempool_auto_types=[all]
consensus=esbocs

[files]
storage_dir=../../../var/lib/network/scorpion/main/

[blocks]
is_celled=false
is_static_genesis_block=true
static_genesis_block=0xD3E07282FC1C4FC733AEE7898BA1017DF7659CA7B64047886FA12EDD82759C23


[esbocs]
#poa_mode=true
# This network still runs the legacy 5.7 consensus rules: the node must accept
# exactly what the nodes that never replayed accepted, or it diverges from them.
# A consensus-version decree carrying an activation BLOCK switches the network to
# the new rules at that height (esbocs consensus_version -value 2 -activate_in ...);
# until that height - and until such a decree exists - the legacy behaviour stays.
legacy_5_7_mode=true
min_validators_count=1
auth_certs_prefix=scorpion.master
validators_addrs=[DFAB::CDC2::A6BA::48FB,BC53::9462::EF3A::E47D,D05E::E083::A665::37A8]
new_round_delay=30
preset_reward=2851988815387151461
