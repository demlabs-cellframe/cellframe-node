# General section
[general]
# General debug mode
debug_mode=
# Debug stream packets
debug_dump_stream_headers=false
# Debug I/O reactor, false by default
#debug_reactor=false
# Debug HTTP protocol, false by default
#debug_http=false
# debug-config=false

# seed mode. WARNING. Used true only when you start the new network
#seed_mode=false

# Auto bring up links and sync everything over them
auto_online=

# Server part
[server]
#   By default you don't need to open you to the world
enabled=
news_url_enabled=false
bugreport_url_enabled=false
listen_address=
# Signed JSON-RPC over HTTP on this server: the /exec_cmd path. The body must be signed
# with a key whose pkey hash is in exec_cmd (comma-separated list). Requests without a valid
# signature are rejected. See [rpc-server] below for the plain (unsigned) alternative.
#exec_cmd=[<authorized public-key hash>]
# Body cap for HTTP requests on this server, bytes (default 16 MB)
#max_request_size=16777216
# listen-port-tcp=
# listen-port-tcp=8079
# External IPv4 address
#ext_address=8.9.10.11
# External IPv6 address
#ext_address6=aaaa:bbbb:deee:96ff:feee:3fff
#
# If not set - used listen_port_tcp for node table auto fill
#ext_port_tcp=8089
#exec_cmd=[]
# Maximum accepted HTTP request body, bytes (1KB..16MB, default 16MB); larger -> 413
#max_request_size=16777216

# Transport servers — each transport listens on its own port.
# If a [server_transport_*] section is absent, the transport is enabled
# with its default port. Remove or comment a section to disable that transport.
[server_transport_http]
port=80

[server_transport_tls]
port=443

[server_transport_websocket]
port=8080

[server_transport_dns]
port=53

[server_options]
# proxy_enable=false
# proxy_enable2=false

[notify_server]
# Listening path have priority above listening address examples to use
# listen_path=[listen/path1,listen/path2,...]
# listen_address=[listen_address1:port1,port2,listen_address2:port3,...]
listen_address=

[stream]
# For now its IAES but thats depricated
#preferred_encryption=SALSA2012 
# Debug stream protocol
# debug_channels=false
# debug_dump_stream_headers=false
#debug=true

# Build in DNS client (need for bootstraping)
[dns_client]
# debug_more=false
# max_tries=5
# timeout=10
# timeout_read_after_connect=5
# ssl_cert_path=
#request_timeout=10

# Bootstrap balancer server
[bootstrap_balancer]
dns_server=false
http_server=true

# Standalone JSON-RPC service over plain dap HTTP (no encryption/signature handshake, which is
# what makes it fast). Runs next to the CLI server and the signed /exec_cmd endpoint; every request
# is executed through the same command set and the same backpressure gate as those two.
#
#   POST /  (and /rpc)   {"method":"<command>","params":[...],"id":1}   - run a command
#   GET  /               command index: every command with its doc and whether this endpoint
#                        would run it for a non-loopback caller
#   GET  /health         200 when the node is ready, 503 + Retry-After otherwise
#
# PUBLISHING COMMANDS: with allowed_cmd_control=true (the default) a non-loopback caller may run
# only the commands listed in allowed_cmd - everything else gets 403; requests from the loopback
# address (127.0.0.1 / ::1) keep the full command set. allowed_cmd_control=false publishes the
# WHOLE set to anyone (only do that behind your own gatekeeper). Loopback is the peer address, so a
# reverse proxy on the same host counts as loopback - restrict with allowed_cmd in that case.
[rpc-server]
# Standalone JSON-RPC service over plain dap HTTP - no encryption/signature handshake, which
# is what makes it fast. POST / and /rpc run a command from {"method","params","id"};
# GET / answers the command index; GET /health mirrors the CLI port readiness.
enable=false
#listen-address=[127.0.0.1:12400]
# true (default) = only allowed_cmd for non-loopback callers, loopback keeps everything.
# false = the whole set is public - only do this behind your own gatekeeper.
#allowed_cmd_control=true
# The public command list for non-loopback callers
#allowed_cmd=[version,net,node,block,token,global_db]
# Request body cap, bytes. Larger bodies get HTTP 413.
#max_request_size=1048576
# Concurrency caps - shared with the CLI port and /exec_cmd (a request through ANY of the
# three entry points counts against the same counters). Over the cap: HTTP 503 + Retry-After.
# Defaults scale with CPUs: max_inflight = 2 x CPU (4..32), max_inflight_heavy = CPU/4 (1..4).
# Heavy = commands that may walk a chain, ledger or address history.
#max_inflight=8
#max_inflight_heavy=1
# Per-/16 token bucket for non-loopback callers. Over the budget: HTTP 429.
#rate_limit=false
#rate_limit_rps=20
#rate_limit_burst=40

# Address index for wallet outputs queries (the "wallet outputs" RPC). Built incrementally
# from chain datums on first start, then kept up to date by datum notifications.
[wallets]
# disable = no address index (wallet outputs falls back to the slow ledger scan)
# local   = index only local wallets (default)
# all     = index every address ever seen on the chains - required for serving
#           "wallet outputs" for arbitrary addresses without a ledger scan fallback.
#wallets_cache=local
# With wallets_cache=all and the index still warming up, answer HTTP 503 + Retry-After
# ("index warming") instead of falling back to the slow ledger scan (default true).
#wallets_cache_cold_reply_unavailable=true

# Ledger defaults
[ledger]
# Keeps the ledger state (transactions, tokens, emissions, stake locks, balances) in GlobalDB so
# a restart reads it back instead of re-processing every datum of every chain. On by default.
# Rebuildable at any time: cellframe-node-cli ledger cache reset -net <net_name>
#cache_enabled=true
# More debug output
# debug_more=true

# DAG defaults
[dag]
# More debug output
# debug_more=true
#threshold_enabled=true

# Links check defaults
[link_manager]
#timer_update_states=5000
#max_attempts_num=2
# reconnect_delay=
#debug_more=true

[srv]
allow_unsigned_orders=false
allow_unverified_orders=false
unverified_orders_lifetime=21600

[srv_pay]
cache_enabled=true

[wallets]
wallets_cache=local

[srv_dns]
enabled=false
pricelist=[]

# Mempool
[mempool]
# gdb_group=
# Automatically false, for enabling need role master or higher
auto_proc=false

[chain]
# debug_more=true
# sync_timeout=
# sync_ack_window_size=
# debug_legacy=false
# pack_size=
# sync_idle_time=

# Chain network settings
[chain_net]
# debug_more=true

[blocks]
# debug_more=true

[sign]
# debug_more=true

[stake]
# debug_more=true

[crypto]
# debug_more=true

[gossip]
# debug_more=true


[stream_ch_chain]
# Uncomment to have more debug information in stream channel Chain
# False by default
#debug_more=true

# Number of hashes packed into the one update packet
# Increase it to reduce update latency
# Decrease if bad networking
# update_pack_size=100

# VPN stream channel processing module
[srv_vpn]
#   Turn to true if you want to share VPN service from you node 
enabled=false
debug_more=false
# Grace period for service , 60 second by default
#grace_period=60 
#   List of loca security access groups. Built in: expats,admins,services,nobody,everybody
network_address=10.11.12.0
network_mask=255.255.255.0
# The network on which the service operates
#net=KelVPN
# Wallet address for transferring payment for the service.
#wallet_addr=
# The name of the certificate for signing receipts. Must match the master node certificate.
#receipt_sign_cert=
# allow_free_srv=false

[srv_xchange]
# debug_more=false


# Console interface server
[cli-server]
enabled=true
# debug_more=false
# debug-cli=false
#unix-only
#listen-path=[../var/run/node_cli]
#listen-address=[127.0.0.1:12345]
version=1
# Static RPC documentation for GET / (relative to dirname of cellframe-node.cfg, usually etc/)
http-index-path=../share/docs/rpc
# Concurrency caps: requests over the cap get an immediate HTTP 429.
# Defaults scale with CPUs: max_inflight = 2 x CPU (4..32), max_inflight_heavy = CPU/4 (1..4).
# Heavy = commands that may walk a chain, ledger or address history
# (wallet outputs, tx_history, block/dag list, mempool list, srv_dex history/orderbook/orders, ...).
#max_inflight=8
#max_inflight_heavy=1
# Per-/16 token bucket for public (non-loopback) callers
#rate_limit=false
#rate_limit_rps=20
#rate_limit_burst=40
# Commands a non-loopback caller may run (comma-separated). Everything else gets "restricted"
# for remote callers; loopback (127.0.0.1 / ::1) keeps the full set.
#allowed_cmd=[version,net,node]
# true = restricted (default): only allowed_cmd for non-loopback. false = the whole set is
# public - only do this behind your own gatekeeper.
#allowed_cmd_control=true
# GET /health on this port: 200 when every net is ONLINE and (with wallets_cache=all)
# the address index is warm, 503 + Retry-After otherwise. Use it as the balancer check.

# Application Resources
[resources]
#   0 means auto detect
threads_cnt=0 
pid_path=../var/run/cellframe-node.pid
log_file=../var/log/cellframe-node.log
wallets_path=../var/lib/wallet
ca_folders=[../var/lib/ca,../share/ca]
# geoip_db_path=
# datum_folder=

[global_db]
#debug_more=true
path=../var/lib/global_db
driver=
#debug_more=true
# mdbx_upper_limit_of_db_size=1024
#pgsql conninfo array
# pg_conninfo=[dbname=postgres]

[srv_dex]
# More debug output (verbose, not for production)
#debug_more=true
# DEX order/history RAM cache: the book and the event history live in memory, queries never
# touch GlobalDB on the read path. Both are on by default.
#cache_enabled=true
# Serialized-reply cache for srv_dex history/orders/orderbook: keyed by the full request,
# invalidated by the pair's event/order version, bounded by entries/MB/TTL.
#history_cache_max_entries=256
#history_cache_max_mbytes=64
#history_cache_ttl_sec=10

# Plugins 
[plugins]
enabled=true
# Load Python-based plugins
#py_load=true   
# Path to Pyhon-based plugins
#py_path=../var/lib/plugins
