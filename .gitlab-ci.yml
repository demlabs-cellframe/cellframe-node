variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_UPDATE_FLAGS: --force

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
    - code_check
    - test_build
    - diagnostic_builds
    - build
    - post_build
    - publish
    - deploy

.cppcheck_full_analysis:
# Performs an in-depth static code analysis with cppcheck, producing a detailed HTML report for manual inspection.
  stage: code_check
  image: demlabs/debian/amd64:qt6
  timeout: 12h
  script:
    - cd /builds/cellframe/cellframe-node
    - mkdir -p build && cd build
    - cmake -DENABLE_CPPCHECK_ANALYSIS=ON ..
    - make cppcheck_analysis
    - echo "HTML report generated at build/cppcheck_html_report/index.html"
  artifacts:
    paths:
      - build/cppcheck_html_report/
    expire_in: 1 day
  rules:
    - when: manual
      allow_failure: true
  tags:
    - ci-polygon

.cppcheck_code_quality:
# Generates a code quality report in JSON format for merge requests, identifying potential issues in the codebase.
  stage: code_check
  image: demlabs/debian/amd64:qt6
  timeout: 3h
  script:
    - cd /builds/cellframe/cellframe-node
    - /usr/bin/cppcheck --xml --library=std --suppress=missingIncludeSystem --suppress=preprocessorErrorDirective -j$(nproc) -q . 2> cppcheck-report.xml
    - cppcheck-codequality --input-file cppcheck-report.xml --output-file gl-code-quality-report.json
    - cat gl-code-quality-report.json
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
    expire_in: 4 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      allow_failure: true
  tags:
    - ci-polygon

.ci-polygon:
  tags:
     - ci-polygon
.ci-ansible:
  tags:
     - ci-ansible

.ci-test:
  tags:
     - ci-test

.build:  
  extends: .ci-polygon
  stage: build
  timeout: 3 hours 30 minutes
  dependencies: []
  interruptible: true
  variables:
    PATCH_NUM_MAIN: "${master_PATCH_NUM}"
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /.*$/
      variables:                                   
        DUMMY_VAR_FOR_ALLOW_JOB: "1"
  artifacts:
    paths:
      - build_*/*.deb

.publish:
  extends: .ci-polygon
  image: demlabs/debian/amd64:qt6
  stage: publish
  before_script: /opt/buildtools/prepare_environment.sh 

.deploy:
  extends: .ci-ansible
  stage: deploy
  rules:
    - if: $CI_COMMIT_REF_NAME == "master"
      when: manual
      allow_failure: true
  allow_failure: true

.fill_version_mk: &fill_version_mk
  - chmod +x ./prod_build/ci/gitlab_project_var.sh ./prod_build/ci/fill_version_mk.sh
  - ./prod_build/ci/fill_version_mk.sh 

amd64:linux.rwd.bld:
    extends: .build
    stage: test_build
    image: demlabs/debian/amd64:qt6
    before_script: 
      - /opt/buildtools/prepare_environment.sh amd64-linux
      - *fill_version_mk
    script:
      - echo "Do hard work"
      - ./tools/prod_build/build.sh --target linux rwd -DBUILD_WITH_PYTHON_ENV=ON 
      - ./tools/prod_build/pack.sh --target linux rwd
    artifacts:
      paths:
        - version.mk
        - build_*/*.deb

stage_env_tests:
  extends: .ci-test
  interruptible: true
  stage: diagnostic_builds
  timeout: 2 hours
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GIT_STRATEGY: fetch
    GIT_SUBMODULE_STRATEGY: none
    GIT_CLEAN_FLAGS: -ffdx -e .stage-env-run/
  dependencies:
    - amd64:linux.rwd.bld
  before_script:
    - |
      if [ -d ".stage-env-run/cache" ]; then
        echo "Cleaning root-owned Docker artifacts..."
        docker run --rm -v "$PWD/.stage-env-run/cache:/cleanup" alpine sh -c "rm -rf /cleanup/*" 2>/dev/null || true
        rm -rf .stage-env-run/ 2>/dev/null || true
      fi
  script:
    - source version.mk
    - DEB_FILE=$(find build_* -type f -name "cellframe-node-${VERSION_MAJOR}.${VERSION_MINOR}-${VERSION_PATCH}-rwd-amd64.deb")
    - /opt/cellframe-stage-env/artifacts.sh "$DEB_FILE"
  artifacts:
    when: always
    paths:
      - test_logs/
    expire_in: 7 days
    
.autotests:
  extends: .ci-test
  interruptible: true
  stage: diagnostic_builds
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  variables:
    GIT_STRATEGY: none
  dependencies:
    - amd64:linux.rwd.bld
  script:
    - |
      source version.mk
      echo "Testing version: ${VERSION_MAJOR}.${VERSION_MINOR}-${VERSION_PATCH}"
      DEB_FILE=$(find build_* -type f -name "cellframe-node-${VERSION_MAJOR}.${VERSION_MINOR}-${VERSION_PATCH}-rwd-amd64.deb")
      echo "Using package: $DEB_FILE"
      /opt/tests-in-docker/artifacts.sh "$DEB_FILE"
  artifacts:
    when: always
    paths:
      - test_logs/
    expire_in: 7 days

asan_build:
  extends: .build
  stage: diagnostic_builds
  variables:
    DAP_ASAN: "1"
  dependencies:
    - amd64:linux.rwd.bld
  image: demlabs/debian/amd64:qt6
  rules:
   - when: manual
     allow_failure: true
  before_script:
   - /opt/buildtools/prepare_environment.sh arm64-linux
  script:
    - ./tools/prod_build/build.sh --target linux rwd 
    - ./tools/prod_build/pack.sh --target linux rwd
    - /opt/buildtools/deploy_files.sh pub_cellframe linux/cellframe-node/$CI_COMMIT_REF_NAME/ build_*/*.deb 

