name: Blocked UTXO Cannot Be Spent
description: End-to-end test verifying that blocked UTXO cannot be spent while unblocked UTXO work normally
author: QA Team
tags: [e2e, utxo-blocking, transfer, critical]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w e2e_snd_w1 -net stagenet -force
    save_wallet: sender_addr
    wait: 3s
  
  - cli: wallet new -w e2e_rcv_w1 -net stagenet -force
    save_wallet: receiver_addr
    wait: 3s
  
  - cli: token_decl -net stagenet -token E2EBLK -total_supply 10000000
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    expect: success
    wait: 10s
  
  - cli: token_emit -net stagenet -token E2EBLK -value 10000000 -addr {{sender_addr}}
    save_regex: "0x[0-9a-fA-F]{64}"
    save: emission
    wait: 5s
  
  - cli: tx_create -net stagenet -token E2EBLK -from_emission {{emission}} -value 1000000 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: utxo1
    wait: 5s
  
  - cli: tx_create -net stagenet -token E2EBLK -from_wallet e2e_snd_w1 -value 1000000 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: utxo2
    wait: 5s
  
  - cli: token_update -net stagenet -token E2EBLK -utxo_blocked_add {{utxo1}}:0
    wait: 3s

test:
  - cli: tx_create -net stagenet -token E2EBLK -from_wallet e2e_snd_w1 -value 500000 -fee 1
    expect: error
  
  - cli: tx_create -net stagenet -token E2EBLK -from_wallet e2e_snd_w1 -value 500000 -to_wallet e2e_rcv_w1 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: transfer_tx
    expect: success
    wait: 3s

check:
  - cli: tx_history -net stagenet -tx {{transfer_tx}}
    contains: "{{transfer_tx}}"
