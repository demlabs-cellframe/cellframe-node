name: Arbitrage Transaction Bypasses Blocked UTXO
description: End-to-end test verifying that arbitrage transactions bypass UTXO blocklist
author: QA Team
tags: [e2e, utxo-blocking, arbitrage, critical]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w e2e_arb_w1 -net stagenet -force
    save_wallet: wallet_addr
    wait: 3s

  - cli: token_decl -net stagenet -token E2EARB -total_supply 1000000
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    expect: success
    wait: 10s
  
  - cli: token_emit -net stagenet -token E2EARB -value 1000000 -addr {{wallet_addr}}
    save_regex: "0x[0-9a-fA-F]{64}"
    save: emission_tx
    wait: 5s
  
  - cli: tx_create -net stagenet -token E2EARB -from_emission {{emission_tx}} -value 500000 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: utxo_tx
    wait: 5s
  
  - cli: token_update -net stagenet -token E2EARB -utxo_blocked_add {{utxo_tx}}:0
    wait: 3s

test:
  - cli: tx_create -net stagenet -token E2EARB -from_wallet e2e_arb_w1 -value 100000 -fee 1
    expect: error
  
  - cli: tx_create -net stagenet -token E2EARB -value 100000 -arbitrage -from_wallet e2e_arb_w1 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: arb_tx
    expect: success
    wait: 3s

check:
  - cli: tx_history -net stagenet -tx {{arb_tx}}
    contains: "{{arb_tx}}"
