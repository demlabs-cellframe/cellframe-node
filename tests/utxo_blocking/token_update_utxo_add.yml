name: token_update -utxo_blocked_add Command
description: Test adding UTXO to token blocklist
tags: [functional, utxo-blocking, token_update, fast]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w utxo_add_w1 -net stagenet -force
    save_wallet: wallet_addr
    wait: 3s

  - cli: token_decl -net stagenet -token UTBLK1 -total_supply 1000000
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    expect: success
    wait: 10s
  
  - cli: token_emit -net stagenet -token UTBLK1 -value 1000 -addr {{wallet_addr}}
    save_regex: "0x[0-9a-fA-F]{64}"
    save: emission
    wait: 5s
  
  - cli: tx_create -net stagenet -token UTBLK1 -from_emission {{emission}} -value 500 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: utxo
    wait: 5s

test:
  - cli: token_update -net stagenet -token UTBLK1 -utxo_blocked_add {{utxo}}:0
    expect: success
    wait: 3s

check:
  - cli: token info -net stagenet -token UTBLK1 -history_limit 10
    contains: "{{utxo}}"
  
  - cli: tx_create -net stagenet -token UTBLK1 -from_wallet utxo_add_w1 -value 100 -fee 1
    expect: error
