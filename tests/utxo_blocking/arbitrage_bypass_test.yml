name: Arbitrage Bypass Test
description: Arbitrage transactions should bypass UTXO blocklist
author: QA Team
tags: [arbitrage, utxo-blocking, critical]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w arb_byp_w1 -net stagenet -force
    save_wallet: wallet_addr
    wait: 3s

  - cli: token_decl -net stagenet -token ARBT2 -total_supply 1000000 -flags UTXO_BLOCKING_ENABLED
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    wait: 10s
  
  - cli: token_emit -net stagenet -token ARBT2 -value 1000000 -addr {{wallet_addr}}
    save_regex: "0x[0-9a-fA-F]{64}"
    save: emission_tx
    wait: 5s
  
  - cli: tx_create -net stagenet -token ARBT2 -from_emission {{emission_tx}} -value 500 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: tx_hash
    wait: 5s
  
  - cli: token_update -net stagenet -token ARBT2 -utxo_blocked_add {{tx_hash}}:0
    wait: 3s

test:
  - cli: tx_create -net stagenet -token ARBT2 -value 100 -fee 1
    expect: error
  
  - cli: tx_create -net stagenet -token ARBT2 -value 100 -arbitrage -from_wallet arb_byp_w1 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: arb_tx
    expect: success
    wait: 3s

check:
  - cli: tx_history -net stagenet -tx {{arb_tx}}
    contains: "{{arb_tx}}"
