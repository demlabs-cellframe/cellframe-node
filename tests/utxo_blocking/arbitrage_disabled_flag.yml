name: UTXO_ARBITRAGE_TX_DISABLED Flag
description: Verify arbitrage can be permanently disabled and is irreversible
tags: [functional, utxo-blocking, arbitrage, flags, fast]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w armdis_w1 -net stagenet -force
    save_wallet: wallet_addr
    wait: 3s

  - cli: token_decl -net stagenet -token ARMDIS -total_supply 1000000 -decimals 18 -signs_total 1 -signs_emission 1 -certs stagenet.root.pvt.0
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    wait: 10s

  - cli: token_emit -net stagenet -token ARMDIS -value 10000 -addr {{wallet_addr}}
    wait: 5s

  - cli: tx_create -net stagenet -token ARMDIS -from_wallet armdis_w1 -value 5000 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: utxo_tx
    wait: 5s

  # Block UTXO
  - cli: token_update -net stagenet -token ARMDIS -utxo_blocked_add {{utxo_tx}}:0
    wait: 3s

  # Disable arbitrage
  - cli: token_update -net stagenet -token ARMDIS -flag_set UTXO_ARBITRAGE_TX_DISABLED
    wait: 3s

test:
  # Arbitrage TX should FAIL (arbitrage disabled)
  - cli: tx_create -net stagenet -token ARMDIS -value 5000 -arbitrage -from_wallet armdis_w1 -fee 1
    expect: error

  # Attempt to unset irreversible flag should FAIL
  - cli: token_update -net stagenet -token ARMDIS -flag_unset UTXO_ARBITRAGE_TX_DISABLED
    expect: error

check:
  # Arbitrage should still be disabled
  - cli: tx_create -net stagenet -token ARMDIS -value 5000 -arbitrage -from_wallet armdis_w1 -fee 1
    expect: error
