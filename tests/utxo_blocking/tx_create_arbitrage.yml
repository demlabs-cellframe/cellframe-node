name: tx_create -arbitrage Command (PDF Scenario 6)
description: Block UTXO, verify arbitrage TX bypasses the block and sends to fee address only
tags: [functional, utxo-blocking, tx_create, arbitrage, critical]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w arb_pdf_w1 -net stagenet -force
    save_wallet: wallet_addr
    wait: 3s

  - cli: token_decl -net stagenet -token ARBPDF -total_supply 1000000 -decimals 18 -signs_total 1 -signs_emission 1 -certs stagenet.root.pvt.0
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    wait: 10s

  - cli: token_emit -net stagenet -token ARBPDF -value 10000 -addr {{wallet_addr}}
    wait: 5s

  # Create UTXO from emission
  - cli: tx_create -net stagenet -token ARBPDF -from_wallet arb_pdf_w1 -value 5000 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: utxo_tx
    wait: 5s

  # Block the UTXO (PDF Scenario 6.2)
  - cli: token_update -net stagenet -token ARBPDF -utxo_blocked_add {{utxo_tx}}:0
    wait: 3s

  # Verify regular TX fails (PDF Scenario 6.2 check)
  - cli: tx_create -net stagenet -token ARBPDF -from_wallet arb_pdf_w1 -value 100 -fee 1
    expect: error

test:
  # Create arbitrage TX — should succeed, bypassing blocked UTXO (PDF Scenario 6.3)
  - cli: tx_create -net stagenet -token ARBPDF -value 5000 -arbitrage -from_wallet arb_pdf_w1 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: arb_tx
    expect: success
    wait: 3s

check:
  - cli: tx_history -net stagenet -tx {{arb_tx}}
    contains: "{{arb_tx}}"
