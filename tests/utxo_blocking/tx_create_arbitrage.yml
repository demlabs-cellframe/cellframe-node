name: tx_create -arbitrage Command
description: Test creating arbitrage transaction with -arbitrage flag
tags: [functional, utxo-blocking, tx_create, arbitrage, fast]
version: "1.0"

variables:
  network_name: stagenet

setup:
  - cli: wallet new -w arb_cmd_w1 -net stagenet -force
    save_wallet: wallet_addr
    wait: 3s

  - cli: token_decl -net stagenet -token ARBT1 -total_supply 1000000
    save_regex: "0x[0-9a-fA-F]{64}"
    save: token_hash
    wait: 10s
  
  - cli: token_emit -net stagenet -token ARBT1 -value 10000 -addr {{wallet_addr}}
    wait: 5s

test:
  - cli: tx_create -net stagenet -token ARBT1 -value 1000 -arbitrage -from_wallet arb_cmd_w1 -fee 1
    save_regex: "0x[0-9a-fA-F]{64}"
    save: arb_tx
    expect: success
    wait: 3s

check:
  - cli: tx_history -net stagenet -tx {{arb_tx}}
    contains: "{{arb_tx}}"
