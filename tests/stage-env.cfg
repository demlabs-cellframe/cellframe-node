[network]
name = stagenet
network_id = 0x1234
consensus_type = esbocs
native_ticker = TCELL

[topology]
root_nodes_count = 3
master_nodes_count = 3
full_nodes_count = 2

[build]
build_type = debug
cellframe_version = latest

[network_settings]
base_rpc_port = 8545
base_p2p_port = 31337
base_cf_port = 7007
base_http_port = 9079
node_port = 8079
base_ip = 172.20.0.10
subnet = 172.20.0.0/16

[consensus]
min_validators = 2
new_round_delay = 30
collecting_level = 10.0
round_start_sync_timeout = 5
round_attempts_max = 2
round_attempt_timeout = 5
consensus_debug = true

[balancer]
enabled = true
type = http
uri = f0intlt4eyl03htogu
max_links_response = 10
request_delay = 20

[features]
monitoring = false
tests = false
crash_artifacts = true

[logging]
log_dir = ../../cache/logs
log_level = info
scenario_logs = true
retain_days = 7

[paths]
project_root = ../..
cache_dir = ../../cache
artifacts_dir = ../../cache/artifacts
cellframe_sdk_path = lib/cellframe-sdk
dap_sdk_path = lib/dap-sdk
cellframe_sdk_git = https://gitlab.demlabs.net/cellframe/cellframe-sdk.git
dap_sdk_git = https://gitlab.demlabs.net/dap/dap-sdk.git
sdk_git_branch = master
tools_base_url = https://pub.cellframe.net
node_var_subdirs = log, lib/ca, lib/global_db, lib/wallet, lib/network

[artifacts]
collect_node_logs = true
collect_health_logs = true
collect_crash_dumps = true
retain_days = 30

[timeouts]
startup = 600
health_check = 600
command = 30

[scenarios]
debug = false

[node_source]
type = local
local_path = /mnt/work/work/cellframe-node/build/cellframe-node-5.7-LOCALBUILD-dbg-amd64.deb

[suite_isolation]
mode = squashfs
squashfs_compression = none
auto_create_on_startup = true
snapshot_name = clean_state
genesis_stage = full
phase1_snapshot_name = phase1_zerochain_genesis
auto_cleanup = true
keep_snapshot_count = 5
snapshots_dir = ../../cache/snapshots

