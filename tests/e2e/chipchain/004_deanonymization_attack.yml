name: Deanonymization attack resistance
description: |
  E2E security tests for transactions with Chipmunk wallets on ChipChain:
  - Timing analysis (rapid TX submission)
  - TX chain consistency
  - Ledger consistency after multiple transfers
  NOTE: Anonymous TX (-anonymous flag with ring signatures, key images,
  Pedersen commitments) is not yet implemented in SDK CLI.
  Current test validates Chipmunk wallet security properties and
  standard TX flow resilience.
version: "1.0"

includes:
  - common/defaults.yml
  - common/create_test_cert.yml

variables:
  token_name: CC_ATTACK
  total_supply: "100000000"
  emission_value: "1000000"
  transfer_value: "100"
  tx_fee: "0.01"

test:
  # ======================================================================
  # Group 1: Setup Chipmunk wallets
  # ======================================================================
  - group: Setup Chipmunk wallets
    steps:
      - cli: "wallet new -w cc_atk_alice -sign_type sig_chipmunk"
        expect: success
        save_wallet: alice_addr

      - cli: "wallet new -w cc_atk_bob -sign_type sig_chipmunk"
        expect: success
        save_wallet: bob_addr

      - cli: "wallet new -w cc_atk_carol -sign_type sig_chipmunk"
        expect: success
        save_wallet: carol_addr

      - cli: "wallet new -w cc_atk_dave -sign_type sig_chipmunk"
        expect: success
        save_wallet: dave_addr

  # ======================================================================
  # Group 2: Token setup
  # ======================================================================
  - group: Token setup
    steps:
      - cli: "token_decl -token {{token_name}} -total_supply {{total_supply}} -decimals 18 -signs_total 1 -signs_emission 1 -certs {{test_cert}}"
        expect: success
        save_hash: token_decl_hash

      - wait_for_datum: "{{token_decl_hash}}"
        chain: zerochain
        timeout: 120

      - cli: "token_emit -token {{token_name}} -emission_value {{emission_value}} -addr {{alice_addr}} -certs {{test_cert}}"
        expect: success
        save_hash: emit_hash

      - wait_for_datum: "{{emit_hash}}"
        chain: zerochain
        timeout: 120

  # ======================================================================
  # Group 3: Timing analysis — rapid TX submission
  # ======================================================================
  - group: Timing analysis attack
    description: |
      Submit multiple TXs in rapid succession.
      Validates that the network processes concurrent TXs correctly.
    steps:
      - cli: "tx_create -token {{token_name}} -value {{transfer_value}} -to_addr {{bob_addr}} -from_wallet cc_atk_alice -fee {{tx_fee}}"
        expect: success
        save_hash: timing_tx_1

      - cli: "tx_create -token {{token_name}} -value {{transfer_value}} -to_addr {{carol_addr}} -from_wallet cc_atk_bob -fee {{tx_fee}}"
        expect: success
        save_hash: timing_tx_2

      - cli: "tx_create -token {{token_name}} -value {{transfer_value}} -to_addr {{dave_addr}} -from_wallet cc_atk_carol -fee {{tx_fee}}"
        expect: success
        save_hash: timing_tx_3

      - wait_for_datum: "{{timing_tx_1}}"
        chain: zerochain
        timeout: 120
      - wait_for_datum: "{{timing_tx_2}}"
        chain: zerochain
        timeout: 120
      - wait_for_datum: "{{timing_tx_3}}"
        chain: zerochain
        timeout: 120

  # ======================================================================
  # Group 4: TX chain consistency
  # ======================================================================
  - group: TX chain consistency
    description: |
      Verify sequential TXs from same wallet are processed correctly.
    steps:
      - cli: "tx_create -token {{token_name}} -value {{transfer_value}} -to_addr {{bob_addr}} -from_wallet cc_atk_alice -fee {{tx_fee}}"
        expect: success
        save_hash: link_tx_1

      - wait_for_datum: "{{link_tx_1}}"
        chain: zerochain
        timeout: 120

      # Verify TX was created
      - cli: "tx get -hash {{link_tx_1}}"
        expect: success

  # ======================================================================
  # Group 5: Multiple TXs with same amount
  # ======================================================================
  - group: Multiple TXs with same amount
    description: |
      Create multiple TXs with the same amount from different wallets.
      Verify all are accepted and processed.
    steps:
      - cli: "tx_create -token {{token_name}} -value {{transfer_value}} -to_addr {{bob_addr}} -from_wallet cc_atk_alice -fee {{tx_fee}}"
        expect: success
        save_hash: amount_tx_1

      - cli: "tx_create -token {{token_name}} -value {{transfer_value}} -to_addr {{carol_addr}} -from_wallet cc_atk_bob -fee {{tx_fee}}"
        expect: success
        save_hash: amount_tx_2

      - wait_for_datum: "{{amount_tx_1}}"
        chain: zerochain
        timeout: 120
      - wait_for_datum: "{{amount_tx_2}}"
        chain: zerochain
        timeout: 120

      # Verify both TXs are accepted
      - cli: "tx get -hash {{amount_tx_1}}"
        expect: success
      - cli: "tx get -hash {{amount_tx_2}}"
        expect: success

  # ======================================================================
  # Group 6: Verify TX integrity
  # ======================================================================
  - group: Verify TX integrity
    description: |
      Check that all submitted transactions are valid and retrievable.
    steps:
      - cli: "tx get -hash {{timing_tx_1}}"
        expect: success

      - cli: "tx get -hash {{timing_tx_2}}"
        expect: success

      - cli: "tx get -hash {{timing_tx_3}}"
        expect: success

  # ======================================================================
  # Group 7: Ledger consistency
  # ======================================================================
  - group: Ledger consistency check
    description: |
      Verify the ledger is consistent after all transactions.
    steps:
      - cli: "ledger info -token {{token_name}}"
        expect: success

      # Bob should have received tokens
      - cli: "wallet info -w cc_atk_bob"
        expect: success
        contains: "{{token_name}}"

      # Carol should have received tokens
      - cli: "wallet info -w cc_atk_carol"
        expect: success
        contains: "{{token_name}}"

      # Dave should have received tokens
      - cli: "wallet info -w cc_atk_dave"
        expect: success
        contains: "{{token_name}}"

  # ======================================================================
  # Group 8: Network health after attacks
  # ======================================================================
  - group: Network health after attacks
    steps:
      - cli: "net get status"
        expect: success
        contains: "NET_STATE_ONLINE"

      - cli: "chain get atoms -chain zerochain -limit 5"
        expect: success
