name: Anonymous transactions with ChipChain
description: |
  E2E test for anonymous ledger on ChipChain consensus:
  - Create wallets with Chipmunk keys
  - Test TX creation with Chipmunk wallets
  - Verify wallet info shows chipmunk sign type
  - Verify ledger consistency
  NOTE: Anonymous TX (-anonymous flag) is not yet implemented in SDK CLI.
  Current test validates Chipmunk wallet creation and standard TX flow.
  Full anonymous TX support (ring signatures, key images, Pedersen commitments)
  requires SDK implementation of chipmunk_snark tx compose API.
version: "1.0"

includes:
  - common/defaults.yml
  - common/create_test_cert.yml

variables:
  token_name: CC_ANON
  total_supply: "10000000"
  emission_value: "1000000"
  anon_transfer_value: "500"
  anon_transfer_value_2: "300"
  tx_fee: "0.01"

test:
  # ======================================================================
  # Group 1: Create Chipmunk wallets
  # ======================================================================
  - group: Create Chipmunk wallets
    description: |
      Generate Chipmunk keypairs for transactions.
      These keys use lattice-based MLWE/MSIS (post-quantum).
    steps:
      - cli: "wallet new -w cc_anon_alice -sign_type sig_chipmunk"
        expect: success
        save_wallet: alice_addr

      - cli: "wallet new -w cc_anon_bob -sign_type sig_chipmunk"
        expect: success
        save_wallet: bob_addr

      - cli: "wallet new -w cc_anon_carol -sign_type sig_chipmunk"
        expect: success
        save_wallet: carol_addr

      # Verify wallet info shows chipmunk sign type
      - cli: "wallet info -w cc_anon_alice"
        expect: success

  # ======================================================================
  # Group 2: Token setup
  # ======================================================================
  - group: Setup token
    steps:
      - cli: "token_decl -token {{token_name}} -total_supply {{total_supply}} -decimals 18 -signs_total 1 -signs_emission 1 -certs {{test_cert}}"
        expect: success
        save_hash: token_decl_hash

      - wait_for_datum: "{{token_decl_hash}}"
        chain: zerochain
        timeout: 120

      - cli: "token_emit -token {{token_name}} -emission_value {{emission_value}} -addr {{alice_addr}} -certs {{test_cert}}"
        expect: success
        save_hash: emit_hash

      - wait_for_datum: "{{emit_hash}}"
        chain: zerochain
        timeout: 120

  # ======================================================================
  # Group 3: Transfer (Alice → Bob) with Chipmunk wallet
  # ======================================================================
  - group: Transfer Alice to Bob
    description: |
      Create a transaction from a Chipmunk-signed wallet.
      Validates that Chipmunk keys work for standard TX flow.
      Full anonymous TX (ring signatures, Pedersen commitments) requires
      SDK chipmunk_snark tx compose implementation.
    steps:
      - cli: "tx_create -token {{token_name}} -value {{anon_transfer_value}} -to_addr {{bob_addr}} -from_wallet cc_anon_alice -fee {{tx_fee}}"
        expect: success
        save_hash: anon_tx_1

      - wait_for_datum: "{{anon_tx_1}}"
        chain: zerochain
        timeout: 120

      # Verify Bob received tokens
      - cli: "wallet info -w cc_anon_bob"
        expect: success
        contains: "{{token_name}}"

  # ======================================================================
  # Group 4: Chain transfer (Bob → Carol)
  # ======================================================================
  - group: Transfer Bob to Carol
    description: |
      Chain transfers to test Chipmunk wallet TX flow.
    steps:
      - cli: "tx_create -token {{token_name}} -value {{anon_transfer_value_2}} -to_addr {{carol_addr}} -from_wallet cc_anon_bob -fee {{tx_fee}}"
        expect: success
        save_hash: anon_tx_2

      - wait_for_datum: "{{anon_tx_2}}"
        chain: zerochain
        timeout: 120

      - cli: "wallet info -w cc_anon_carol"
        expect: success
        contains: "{{token_name}}"

  # ======================================================================
  # Group 5: Verify TX properties
  # ======================================================================
  - group: Verify TX properties
    description: |
      Check that transactions were created and processed.
    steps:
      - cli: "tx get -hash {{anon_tx_1}}"
        expect: success

      - cli: "tx get -hash {{anon_tx_2}}"
        expect: success

  # ======================================================================
  # Group 6: Ledger consistency
  # ======================================================================
  - group: Ledger consistency
    steps:
      - cli: "ledger info -token {{token_name}}"
        expect: success

  # ======================================================================
  # Group 7: Verify chain health
  # ======================================================================
  - group: Verify chain health
    steps:
      - cli: "net get status"
        expect: success
        contains: "NET_STATE_ONLINE"
