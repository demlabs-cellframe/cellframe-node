name: Token negative tests
description: |
  Verify that invalid token operations fail correctly:
  invalid cert, non-existent token emit, non-existent token info
version: "1.0"

includes:
  - common/defaults.yml
  - common/create_test_cert.yml

test:
  - group: Emit without required addr parameter should fail
    steps:
      - cli: "token_emit -token NOSUCHTOKEN -emission_value 100 -certs test_cert"
        expect: error
        contains: "requires parameter"

  - group: Emit with invalid cert should fail
    steps:
      - cli: "token_emit -token TCELL -emission_value 100 -addr aaaa1111bbbb2222 -certs nonexistent_cert"
        expect: error

  # Disabled: `token info -name <missing>` segfaults cellframe-node (exit 139) on 6.x;
  # re-enable after SDK fix in dap_chain_ledger_cli / ledger token lookup.
  # - group: Token info for non-existent token
  #   steps:
  #     - cli: "token info -net {{network_name}} -name DEFINITELY_NOT_EXISTS"
  #       expect: error
