name: "Regression - Arbitrage Availability"
description: |
  Arbitrage transactions must be available immediately after token creation,
  emission and base_tx confirmation. No additional delay should be required.

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{all_nodes}}"
    detach: true

  - wait_network: online
    nodes: "{{all_nodes}}"
    timeout: 120

test:
  - group: Setup Wallet and Fund
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet new -w arb_owner"
      - cli: "wallet info -w arb_owner"
        save_wallet: owner_addr

      - cli: "wallet new -w arb_aux"
      - cli: "wallet info -w arb_aux"
        save_wallet: aux_addr

      - cli: "tx_create -from_wallet stagenet_root_0 -to_addr {{owner_addr}} -value 10000000000000000000 -token {{native_ticker}} -fee 50000000000000000"
        save_hash: fund_hash
      - wait_for_datum: "{{fund_hash}}"
        chain: main
        timeout: 120

  - group: Declare Token and Emit
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "token_decl -token ARB_TEST -type CF20 -total_supply 1000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash
      - wait_for_datum: "{{token_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token ARB_TEST -emission_value 1000000000000000000 -addr {{owner_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_hash
      - wait_for_datum: "{{emission_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "tx_create -from_emission {{emission_hash}} -wallet_fee arb_owner -value 1000000000000000000 -token ARB_TEST -fee 50000000000000000"
        save_hash: base_hash
      - wait_for_datum: "{{base_hash}}"
        chain: main
        timeout: 120

  - group: Test Arbitrage Immediately After Token Setup
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "tx_create -from_wallet arb_owner -to_addr {{aux_addr}} -value 100 -token ARB_TEST -arbitrage -certs {{network_name}}.root.pvt.0 -fee 50000000000000000"
        save_hash: arb_tx_hash
        expect: success

      - wait_for_datum: "{{arb_tx_hash}}"
        chain: main
        timeout: 60
