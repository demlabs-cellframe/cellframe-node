name: "Regression - Arbitrage Arguments"
description: |
  tx_create -arbitrage must correctly use the -value and -token arguments.
  After an arbitrage TX, the wallet balance should decrease by the specified value,
  and tx_history should reflect the exact amount.

includes:
  - common/set_net_default.yml

network:
  topology: default
  name: "{{network_name}}"

setup:
  - docker_op: start
    services: "{{all_nodes}}"
    detach: true

  - wait_network: online
    nodes: "{{all_nodes}}"
    timeout: 120

test:
  - group: Setup Wallet and Fund
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "wallet new -w arb_args_owner"
      - cli: "wallet info -w arb_args_owner"
        save_wallet: owner_addr

      - cli: "wallet new -w arb_args_aux"
      - cli: "wallet info -w arb_args_aux"
        save_wallet: aux_addr

      - cli: "tx_create -from_wallet stagenet_root_0 -to_addr {{owner_addr}} -value 10000000000000000000 -token {{native_ticker}} -fee 50000000000000000"
        save_hash: fund_hash
      - wait_for_datum: "{{fund_hash}}"
        chain: main
        timeout: 120

  - group: Declare Token and Emit
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "token_decl -token ARB_ARGS -type CF20 -total_supply 2000000000000000000 -decimals 18 -signs_emission 1 -signs_total 1 -certs {{network_name}}.root.pvt.0"
        save_hash: token_hash
      - wait_for_datum: "{{token_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "token_emit -token ARB_ARGS -emission_value 2000000000000000000 -addr {{owner_addr}} -certs {{network_name}}.root.pvt.0"
        save_hash: emission_hash
      - wait_for_datum: "{{emission_hash}}"
        chain: zerochain
        timeout: 60

      - cli: "tx_create -from_emission {{emission_hash}} -wallet_fee arb_args_owner -value 2000000000000000000 -token ARB_ARGS -fee 50000000000000000"
        save_hash: base_hash
      - wait_for_datum: "{{base_hash}}"
        chain: main
        timeout: 120

  - group: Normal TX then Arbitrage TX
    defaults:
      node: "{{first_root}}"
    steps:
      - cli: "tx_create -from_wallet arb_args_owner -to_addr {{aux_addr}} -value 1000000000000000000 -token ARB_ARGS -fee 50000000000000000"
        save_hash: normal_tx_hash
      - wait_for_datum: "{{normal_tx_hash}}"
        chain: main
        timeout: 60

      - cli: "tx_create -from_wallet arb_args_owner -to_addr {{aux_addr}} -value 500 -token ARB_ARGS -arbitrage -certs {{network_name}}.root.pvt.0 -fee 50000000000000000"
        save_hash: arb_tx_hash
      - wait_for_datum: "{{arb_tx_hash}}"
        chain: main
        timeout: 60

      - cli: "tx_history -tx {{arb_tx_hash}}"
        contains: "500"

check:
  - cli: "wallet info -w arb_args_owner"
    node: "{{first_root}}"
    contains: "ARB_ARGS"
    not_contains: "2.000000000000000000"
