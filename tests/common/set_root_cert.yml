# Common: Set ROOT certificates for testing
# 
# IMPORTANT: For zerochain (DAG-PoA), datums must be signed by authorized ROOT certificates.
# The auth_certs_number_verify parameter determines minimum required signatures.
# 
# For TCELL: requires 3 signatures (hardcoded in SDK)
# For custom tokens: depends on signs_emission/signs_total parameters
#
# After genesis, ROOT certificates are available on nodes based on their roles.
#
# Usage: Include this file and use -certs {{root_certs}} or {{root_certs_tcell}} as needed.

setup:
  # Define ROOT certificate variables dynamically based on network_name
  # These execute during runtime when network_name is already set
  
  - set: root_certs
    value: "f'{network_name}.root.pvt.0,{network_name}.root.pvt.1'"
    eval: true
    
  - set: root_cert_single
    value: "f'{network_name}.root.pvt.0'"
    eval: true
    
  - set: root_certs_tcell
    value: "f'{network_name}.root.pvt.0,{network_name}.root.pvt.1,{network_name}.root.pvt.2'"
    eval: true
